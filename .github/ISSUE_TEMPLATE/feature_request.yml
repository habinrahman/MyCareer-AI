name: Feature request
description: Suggest an idea for MyCareer AI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem does this solve for students or career seekers?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Resume analysis
        - Career chat / mentorship
        - Job matching / benchmarks
        - Auth / user experience
        - DevOps / infrastructure
        - Documentation
        - Other
